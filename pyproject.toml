[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "organoid-transplantation-research-landscape"
version = "1.0.0"
description = "Reproducible evidence mapping of organoid transplantation studies"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Tharuniya Anpalakan", email = "w25070895@northumbria.ac.lk"}]
dependencies = [
  "pandas==3.0.6",
  "numpy==2.5.4",
  "matplotlib==3.11.2",
  "seaborn==0.13.2",
  "networkx==3.7",
  "requests==2.34.2",
  "ipykernel==7.4.0",
  "nbclient==0.11.0",
  "nbformat==5.11.1",
  "reportlab==5.0.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["src*"]

